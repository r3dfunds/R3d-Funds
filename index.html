<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R3d Funds — Personal Finance Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --up: #006300;
  --down: #d03b3b;
  --s1: #2a78d6; /* blue  - bank */
  --s2: #1baf7a; /* aqua  - brokerage */
  --s3: #eda100; /* yellow- fixed income */
  --s4: #008300; /* green - cash */
  --s5: #4a3aa7; /* violet- business */
  --s6: #eb6834; /* orange- property */
  --s7: #e87ba4; /* magenta-other */
  --s8: #a52322; /* deep red - liabilities */
  --seq: #2a78d6;
  --accent: #2a78d6;
  --card-r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --up: #0ca30c;
    --down: #e66767;
    --s1: #3987e5;
    --s2: #199e70;
    --s3: #c98500;
    --s4: #008300;
    --s5: #9085e9;
    --s6: #d95926;
    --s7: #d55181;
    --s8: #c96a69;
    --seq: #3987e5;
    --accent: #3987e5;
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page); color: var(--ink);
  font-size: 14px; line-height: 1.45;
}
.shell { display: flex; min-height: 100vh; }
.side {
  width: 232px; flex-shrink: 0; background: #0e1626; color: #c7d0e4;
  display: flex; flex-direction: column; gap: 26px; padding: 24px 14px 18px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
.brand-row { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#e34948,#a52322);
  color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center;
  letter-spacing: .02em;
}
.brand-name { font-size: 16px; font-weight: 750; color: #fff; letter-spacing: -0.2px; }
.brand-sub { font-size: 10px; text-transform: uppercase; letter-spacing: .18em; color: #6b7a9c; margin: 4px 0 0 44px; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.navitem {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  background: none; border: none; color: #93a1c0; font: inherit; font-size: 13.5px;
  padding: 10px 12px; border-radius: 9px; cursor: pointer; font-weight: 500;
}
.navitem:hover { background: rgba(255,255,255,.05); color: #e6ebf5; }
.navitem.active {
  background: rgba(42,120,214,.16); color: #fff; font-weight: 650;
  box-shadow: inset 3px 0 0 #3987e5;
}
.ni-ico { width: 18px; text-align: center; opacity: .85; font-size: 14px; }
.side-foot { margin-top: auto; padding: 0 10px; }
.mode-pill {
  font-size: 9.5px; letter-spacing: .14em; padding: 5px 10px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.14); color: #8fa0c2; display: inline-block;
}
.content { flex: 1; min-width: 0; }
.topbar {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
  padding: 30px 38px 0;
}
.page-title { font-size: 23px; font-weight: 750; letter-spacing: -0.4px; }
.page-date { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
main { padding: 20px 38px 48px; max-width: 1160px; }
@media (max-width: 860px) {
  .shell { flex-direction: column; }
  .side { width: 100%; height: auto; position: static; flex-direction: row; align-items: center;
    padding: 10px 12px; gap: 12px; overflow-x: auto; }
  .brand-sub, .side-foot { display: none; }
  .side nav { flex-direction: row; }
  .navitem { padding: 8px 10px; white-space: nowrap; }
  .topbar, main { padding-left: 16px; padding-right: 16px; }
}
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px 22px; margin-bottom: 18px;
  box-shadow: 0 1px 2px rgba(16,24,40,.05);
}
.card h2 {
  font-size: 11px; font-weight: 700; margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2);
}
.card h2 .sub { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 8px; text-transform: none; letter-spacing: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1100px) { .grid4 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .grid2, .grid3, .grid4 { grid-template-columns: 1fr; } }
.hero-value { font-size: 31px; font-weight: 780; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
.hero-sub { color: var(--ink-2); margin-top: 2px; }
.delta-up { color: var(--up); font-weight: 600; }
.delta-down { color: var(--down); font-weight: 600; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
     color: var(--muted); font-weight: 650; padding: 8px; border-bottom: 1px solid var(--baseline); }
td { padding: 9px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--page); }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; }
.chip { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align: -1px; }
button.btn, .btn {
  background: var(--accent); color: #fff; border: none; font: inherit; font-weight: 600;
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
}
button.btn.secondary { background: none; color: var(--ink); border: 1px solid var(--baseline); font-weight: 500; }
button.btn.danger { background: none; color: var(--down); border: 1px solid var(--down); font-weight: 500; }
button.btn:disabled { opacity: .5; cursor: default; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--page);
  border: 1px solid var(--baseline); border-radius: 8px; padding: 8px 10px; width: 100%;
}
textarea { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
label { display: block; font-size: 12px; color: var(--ink-2); margin: 10px 0 4px; font-weight: 600; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.row > div { flex: 1; min-width: 130px; }
.muted { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }
.tooltip {
  position: fixed; pointer-events: none; z-index: 99; display: none;
  background: var(--ink); color: var(--surface-1); padding: 6px 10px;

}
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
svg text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.acct-link { color: var(--accent); cursor: pointer; font-weight: 600; }
.tag { font-size: 11px; color: var(--muted); }
dialog {
  border: 1px solid var(--border); border-radius: 12px; padding: 20px;
  background: var(--surface-1); color: var(--ink); max-width: 420px; width: 92%;
}
dialog::backdrop { background: rgba(0,0,0,.4); }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);

}
.kindpill { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--border); }

<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-row"><span class="brand-mark">R3</span><span class="brand-name">R3d Funds</span></div>
      <span class="brand-sub">Wealth Console</span>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot"><span class="mode-pill" id="modePill">LOCAL</span>
      <div style="font-size:10px;color:#4d5c7d;margin-top:8px">v2.0 · corporate</div></div>
  </aside>
  <div class="content">
    <div class="topbar">
      <div><div class="page-title" id="pageTitle">Dashboard</div>
      <div class="page-date" id="pageDate"></div></div>
    </div>
    <main id="main"></main>
  </div>
</div>
<div class="tooltip" id="tt"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   My Funds — personal net-worth & ledger tracker
   Layers: ledger (transactions) + monthly snapshots -> derived
   Storage: localStorage ("local mode") or Supabase (cloud mode)
   ============================================================ */

const ACCT_TYPES = {
  bank:        { label: "Bank",         color: "var(--s1)" },
  brokerage:   { label: "Stocks (PSX)", color: "var(--s2)" },
  fixed_income:{ label: "Fixed income", color: "var(--s3)" },
  cash:        { label: "Cash in hand", color: "var(--s4)" },
  business:    { label: "Business",     color: "var(--s5)" },
  property:    { label: "Property",     color: "var(--s6)" },
  other:       { label: "Other",        color: "var(--s7)" },
  liability:   { label: "Liability",    color: "var(--s8)" },
};
/* what counts toward zakat by default — you can override per account */
const ZAKAT_DEFAULT = { bank: true, cash: true, brokerage: true, fixed_income: true,
  business: true, other: true, property: false, liability: false };
const zakatIncluded = a => a.zakat_include == null ? !!ZAKAT_DEFAULT[a.type] : !!a.zakat_include;
const TXN_KINDS = {
  income:       { label: "Add (deposit from outside)", sign: +1, external: true },
  spend:        { label: "Withdraw (spending)",        sign: -1, external: true },
  transfer_in:  { label: "Transfer in",                sign: +1, external: false },
  transfer_out: { label: "Transfer out",               sign: -1, external: false },
};

/* ---------------- storage layer ---------------- */
const LS_KEY = "myfunds-data-v1";
const CFG_KEY = "myfunds-config-v1";

function loadCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch { return {}; } }
function saveCfg(c) { localStorage.setItem(CFG_KEY, JSON.stringify(c)); }
let cfg = loadCfg();

let DB = { accounts: [], txns: [], snapshots: [], targets: {}, importBatches: {} };
let supa = null, supaUser = null;
let lockKey = null; // in-memory AES key while unlocked
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());

/* ----- encryption (password lock) ----- */
const bufToB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const b64ToBuf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, saltB64) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64ToBuf(saltB64), iterations: 150000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encStr(key, str) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(str));
  return { iv: bufToB64(iv), ct: bufToB64(ct) };
}
async function decStr(key, obj) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBuf(obj.iv) }, key, b64ToBuf(obj.ct));
  return new TextDecoder().decode(pt);
}

function localLoad() {
  try {
    const parsed = JSON.parse(localStorage.getItem(LS_KEY)) || {};
    if (parsed.enc) return; // encrypted — loaded at unlock instead
    DB = Object.assign({ accounts: [], txns: [], snapshots: [], targets: {}, importBatches: {} }, parsed);
  }
  catch { /* corrupted -> start empty, never overwrite until next save */ }
}
function localSave() {
  if (lockKey) {
    encStr(lockKey, JSON.stringify(DB)).then(o =>
      localStorage.setItem(LS_KEY, JSON.stringify({ enc: 1, iv: o.iv, ct: o.ct })));
  } else localStorage.setItem(LS_KEY, JSON.stringify(DB));
}

function isCloud() { return !!(cfg.supabaseUrl && cfg.supabaseKey); }

async function cloudInit() {
  supa = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const { data } = await supa.auth.getSession();
  supaUser = data.session ? data.session.user : null;
}
let cloudIssues = [];
async function cloudLoadAll() {
  cloudIssues = [];
  const [a, t, s, g] = await Promise.all([
    supa.from("accounts").select("*").order("created_at"),
    supa.from("transactions").select("*").order("date").order("created_at"),
    supa.from("snapshots").select("*").order("date"),
    supa.from("settings").select("*"),
  ]);
  const note = (name, res) => {
    if (res.error) cloudIssues.push(`${name}: ${res.error.message}${res.error.hint ? " — " + res.error.hint : ""}`);
    return res.error ? [] : (res.data || []);
  };
  DB.accounts = note("accounts", a);
  DB.txns = note("transactions", t).map(r => ({ ...r, amount: Number(r.amount) }));
  DB.snapshots = note("snapshots", s).map(r => ({ ...r, value: Number(r.value) }));
  DB.targets = {}; DB.importBatches = {};
  note("settings", g).forEach(r => {
    if (r.key === "targets") DB.targets = r.value || {};
    if (r.key === "import_batches") DB.importBatches = r.value || {};
  });
  if (cloudIssues.length) throw new Error(cloudIssues.join(" | "));
}
function cloudBanner() {
  if (!cloudIssues.length) return "";
  const missing = cloudIssues.some(m => /does not exist|schema cache|relation/i.test(m));
  return `<div class="card" style="border-color:var(--down)">
    <h2 style="color:var(--down)">Cloud connection problem</h2>
    <ul class="muted" style="margin:0 0 8px 18px">${cloudIssues.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
    ${missing ? `<p class="muted">Looks like the tables are missing. In Supabase → <strong>SQL Editor</strong>,
      run <code>schema.sql</code> again, then reload this page.</p>`
    : `<p class="muted">Often temporary (Supabase outage or a paused project).
      Reload in a minute; if it persists, check Supabase → Table Editor shows the 4 tables.</p>`}
    <p><button class="btn" onclick="location.reload()">Reload</button></p></div>`;
}

/* unified writes: mutate DB then persist */
async function persistInsert(table, row) {
  if (isCloud() && supaUser) {
    const { error } = await supa.from(table).insert({ ...row, user_id: supaUser.id });
    if (error) { toast("Save failed: " + error.message); throw error; }
  } else localSave();
}
async function persistDeleteMany(table, ids) {
  if (!ids.length) return;
  if (isCloud() && supaUser) {
    for (let i = 0; i < ids.length; i += 300) {
      const chunk = ids.slice(i, i + 300);
      const { error } = await supa.from(table).delete().in("id", chunk);
      if (error) { toast("Delete failed: " + error.message); throw error; }
    }
  } else localSave();
}
async function persistDelete(table, id) {
  if (isCloud() && supaUser) {
    const { error } = await supa.from(table).delete().eq("id", id);
    if (error) { toast("Delete failed: " + error.message); throw error; }
  } else localSave();
}
async function persistInsertMany(table, rows) {
  if (!rows.length) return;
  if (isCloud() && supaUser) {
    for (let i = 0; i < rows.length; i += 300) {           // Supabase payload-size safety
      const chunk = rows.slice(i, i + 300).map(r => ({ ...r, user_id: supaUser.id }));
      const { error } = await supa.from(table).insert(chunk);
      if (error) { toast("Save failed: " + error.message); throw error; }
    }
  } else localSave();
}
async function persistUpdate(table, id, patch) {
  if (isCloud() && supaUser) {
    const { error } = await supa.from(table).update(patch).eq("id", id);
    if (error) { toast("Save failed: " + error.message); throw error; }
  } else localSave();
}
async function persistTargets() {
  if (isCloud() && supaUser) {
    const { error } = await supa.from("settings")
      .upsert({ key: "targets", value: DB.targets, user_id: supaUser.id }, { onConflict: "user_id,key" });
    if (error) toast("Save failed: " + error.message);
  } else localSave();
}
async function persistImportBatches() {
  if (isCloud() && supaUser) {
    const { error } = await supa.from("settings")
      .upsert({ key: "import_batches", value: DB.importBatches, user_id: supaUser.id }, { onConflict: "user_id,key" });
    if (error) toast("Save failed: " + error.message);
  } else localSave();
}

/* ---------------- domain helpers ---------------- */
const fmtDate = d => d; // ISO yyyy-mm-dd stored everywhere
/* local-date formatting — toISOString() would shift the day for UTC+5 (Pakistan) */
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => isoDate(new Date());
const monthOf = d => d.slice(0, 7);

function fmtRs(n, compact) {
  if (n == null || isNaN(n)) return "—";
  const neg = n < 0; const a = Math.abs(n);
  let s;
  if (compact) {
    if (a >= 1e7) s = (a / 1e7).toFixed(a >= 1e8 ? 0 : 1) + " cr";
    else if (a >= 1e5) s = (a / 1e5).toFixed(a >= 1e6 ? 0 : 1) + " lac";
    else if (a >= 1e3) s = (a / 1e3).toFixed(0) + "k";
    else s = a.toFixed(0);
  } else s = a.toLocaleString("en-PK", { maximumFractionDigits: 0 });
  return (neg ? "−" : "") + "Rs " + s;
}
function fmtPct(x, digits = 1) {
  if (x == null || isNaN(x) || !isFinite(x)) return "—";
  if (Math.abs(x) < 0.0005) return "0.0%";
  return (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(digits) + "%";
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function acctById(id) { return DB.accounts.find(a => a.id === id); }
function acctName(id) { const a = acctById(id); return a ? a.name : "?"; }

/* snapshot dates (sorted unique) */
function snapDates() { return [...new Set(DB.snapshots.map(s => s.date))].sort(); }

/* carried-forward value of an account at a snapshot date */
function valueAt(accountId, date) {
  let best = null;
  for (const s of DB.snapshots)
    if (s.account_id === accountId && s.date <= date && (!best || s.date > best.date)) best = s;
  return best ? best.value : null;
}
function latestSnapDate() { const d = snapDates(); return d.length ? d[d.length - 1] : null; }

function netWorthSeries() {
  return snapDates().map(d => ({
    date: d,
    value: DB.accounts.reduce((sum, a) => sum + (valueAt(a.id, d) || 0), 0),
  }));
}

/* XIRR — bisection on annualized rate. flows: [{date, amount}] investor
   perspective: money put IN is negative, money taken OUT + ending value positive */
function xirr(flows) {
  if (flows.length < 2) return null;
  const t0 = new Date(flows[0].date).getTime();
  const yrs = f => (new Date(f.date).getTime() - t0) / 3.15576e10;
  const hasNeg = flows.some(f => f.amount < 0), hasPos = flows.some(f => f.amount > 0);
  if (!hasNeg || !hasPos) return null;
  /* all flows on the same date -> no time value to solve for; every rate satisfies the
     equation equally (npv is flat), so the bisection below would converge to an
     arbitrary point in its search range rather than a real answer. */
  if (flows.every(f => yrs(f) === 0)) return null;
  const npv = r => flows.reduce((s, f) => s + f.amount / Math.pow(1 + r, yrs(f)), 0);
  let lo = -0.9999, hi = 10;
  let flo = npv(lo), fhi = npv(hi);
  if (flo * fhi > 0) return null;
  for (let i = 0; i < 100; i++) {
    const mid = (lo + hi) / 2, fm = npv(mid);
    if (Math.abs(fm) < 1e-7) return mid;
    if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}

/* per-account XIRR: all txns touching the account + ending value */
function accountXirr(accountId) {
  const end = latestSnapDate(); if (!end) return null;
  const endVal = valueAt(accountId, end); if (endVal == null) return null;
  const first = DB.snapshots.filter(s => s.account_id === accountId).sort((a, b) => a.date < b.date ? -1 : 1)[0];
  // txns at or before the opening snapshot are already baked into its value — skip them
  const flows = DB.txns
    .filter(t => t.account_id === accountId && t.date <= end && (!first || t.date > first.date))
    .map(t => ({ date: t.date, amount: -TXN_KINDS[t.kind].sign * t.amount }));
  // opening value acts as the initial investment
  if (first) flows.push({ date: first.date, amount: -first.value });
  flows.push({ date: end, amount: endVal });
  flows.sort((a, b) => a.date < b.date ? -1 : 1);
  // merge same-date flows
  const merged = [];
  for (const f of flows) {
    const last = merged[merged.length - 1];
    if (last && last.date === f.date) last.amount += f.amount; else merged.push({ ...f });
  }
  return xirr(merged);
}

/* total portfolio XIRR: external flows only */
/* "Overall return" only makes sense for money that's actually invested — a bank/cash
   account isn't earning anything, it's just where salary lands and bills get paid.
   So this aggregates ONLY investment-type accounts (EARN_TYPES), and treats a transfer
   as an external flow into/out of that pool exactly when it crosses the boundary
   (bank -> TS is money invested; TS -> bank is money withdrawn). A transfer between two
   investment accounts is internal to the pool and doesn't count. */
function totalXirr() {
  const investAccts = DB.accounts.filter(a => EARN_TYPES[a.type]);
  if (!investAccts.length) return null;
  const investIds = new Set(investAccts.map(a => a.id));
  const poolValue = d => investAccts.reduce((s, a) => {
    const v = valueAt(a.id, d); return s + (v != null && v >= 0 ? v : 0);
  }, 0);
  const dates = snapDates().filter(d => investAccts.some(a => valueAt(a.id, d) != null));
  if (dates.length < 1) return null;
  const start = dates[0], end = dates[dates.length - 1];
  const startVal = poolValue(start), endVal = poolValue(end);

  const flows = [];
  DB.txns.forEach(t => {
    if (!investIds.has(t.account_id) || t.date < start || t.date > end) return;
    if (t.kind === "income" || t.kind === "spend") {
      flows.push({ date: t.date, amount: -TXN_KINDS[t.kind].sign * t.amount });
    } else {
      const partner = t.group_id ? DB.txns.find(x => x.group_id === t.group_id && x.id !== t.id) : null;
      if (!partner || !investIds.has(partner.account_id))
        flows.push({ date: t.date, amount: -TXN_KINDS[t.kind].sign * t.amount });
    }
  });
  flows.push({ date: start, amount: -startVal });
  flows.push({ date: end, amount: endVal });
  flows.sort((a, b) => a.date < b.date ? -1 : 1);
  return xirr(flows);
}

/* closing balance implied by the ledger alone: opening snapshot + every flow up to `date`.
   Shared by the Ledger balance column and the Snapshot screen so both always agree. */
function ledgerBalanceAt(accountId, date) {
  const r = ledgerBalanceInfo(accountId, date);
  return r ? r.value : null;
}
/* also reports whether an opening balance was actually known — without one the
   figure is just the net of flows, which is usually negative and meaningless */
function ledgerBalanceInfo(accountId, date) {
  /* stable sort by date keeps same-day rows in the order they were imported,
     so per-row balances follow the bank statement's own sequence */
  const txns = DB.txns.filter(t => t.account_id === accountId && t.date <= date)
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (!txns.length) return null;
  /* strictly BEFORE the first entry: a snapshot on the same date is an end-of-day figure that
     already includes that day's entries, so treating it as opening would double-count them */
  const before = DB.snapshots.filter(s => s.account_id === accountId && s.date < txns[0].date)
    .sort((a, b) => a.date < b.date ? -1 : 1);
  const hasOpening = before.length > 0;
  const opening = hasOpening ? before[before.length - 1].value : 0;
  return { value: txns.reduce((s, t) => s + TXN_KINDS[t.kind].sign * t.amount, opening),
           hasOpening, opening, firstDate: txns[0].date };
}

/* net external flow into an account between two dates (exclusive prev, inclusive cur) */
function flowsBetween(accountId, after, upto) {
  return DB.txns
    .filter(t => t.account_id === accountId && t.date > after && t.date <= upto)
    .reduce((s, t) => s + TXN_KINDS[t.kind].sign * t.amount, 0);
}

/* monthly spending (kind=spend) for last n months */
function monthlySpend(n = 12) {
  const map = {};
  DB.txns.filter(t => t.kind === "spend").forEach(t => {
    const m = monthOf(t.date); map[m] = (map[m] || 0) + t.amount;
  });
  const months = Object.keys(map).sort().slice(-n);
  return months.map(m => ({ month: m, value: map[m] }));
}

    <p style="margin-top:10px"><button class="btn" onclick="copyAiPrompt()">Copy AI review prompt</button></p></div>`;
  return html;
}

function targetDriftHtml(alloc, total) {
  const t = DB.targets || {};
  const keys = Object.keys(t).filter(k => t[k] > 0);
  if (!keys.length) return `<p class="muted" style="margin-top:8px">Set target allocation in Settings to track drift.</p>`;
  let rows = "";
  for (const k of keys) {
    const actual = (alloc[k] || 0) / total;
    const drift = actual - t[k] / 100;
    rows += `<tr><td><span class="chip" style="background:${ACCT_TYPES[k].color}"></span>${ACCT_TYPES[k].label}</td>
      <td class="num">${(actual * 100).toFixed(1)}%</td><td class="num">${t[k]}%</td>
      <td class="num ${Math.abs(drift) > 0.05 ? "delta-down" : "muted"}">${fmtPct(drift)}</td></tr>`;
  }
  return `<table style="margin-top:10px"><thead><tr><th>Type</th><th class="num">Actual</th><th class="num">Target</th><th class="num">Drift</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ---------------- Review (reconciliation statement) ---------------- */
const EARN_TYPES = { brokerage: 1, fixed_income: 1, business: 1, property: 1, other: 1 };

function flowBreakdown(accountId, after, upto) {
  const b = { income: 0, spend: 0, transfer_in: 0, transfer_out: 0 };
  DB.txns.forEach(t => {
    if (t.account_id === accountId && t.date > after && t.date <= upto) b[t.kind] += t.amount;
  });
  return b;
}

/* per snapshot period: net money the user added vs what investments earned */
function periodBreakdown() {
  const dates = snapDates(); const out = [];
  for (let i = 1; i < dates.length; i++) {
    const prev = dates[i - 1], cur = dates[i];
    let added = 0, spent = 0, earned = 0;
    DB.txns.forEach(t => {
      if (t.date > prev && t.date <= cur) {
        if (t.kind === "income") added += t.amount;
        if (t.kind === "spend") spent += t.amount;
      }
    });
    for (const a of DB.accounts) {
      const pv = valueAt(a.id, prev) || 0, cv = valueAt(a.id, cur) || 0;
      const res = cv - pv - flowsBetween(a.id, prev, cur);
      if (EARN_TYPES[a.type] && pv >= 0 && cv >= 0) earned += res;
    }
    out.push({ label: cur.slice(2, 7), added: added - spent, earned });
  }
  return out.slice(-12);
}

function groupedBarChart(data) {
  const W = 900, H = 240, P = { l: 64, r: 10, t: 14, b: 28 };
  const vals = data.flatMap(d => [d.added, d.earned, 0]);
  let vmin = Math.min(...vals), vmax = Math.max(...vals);
  const pad = (vmax - vmin) * 0.12 || 1; vmax += pad; if (vmin < 0) vmin -= pad;
  const Y = v => P.t + (1 - (v - vmin) / (vmax - vmin)) * (H - P.t - P.b);
  const slot = (W - P.l - P.r) / data.length;
  const bw = Math.min(26, slot / 2 - 6);
  let grid = "";
  for (let g = 0; g <= 3; g++) {
    const v = vmin + (vmax - vmin) * g / 3, y = Y(v);
    grid += `<line x1="${P.l}" y1="${y}" x2="${W - P.r}" y2="${y}" stroke="var(--grid)"/>
      <text x="${P.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtRs(v, true)}</text>`;
  }
  const y0 = Y(0);
  let bars = "", xl = "";
  data.forEach((d, i) => {
    const cx = P.l + (i + 0.5) * slot;
    [[d.added, "var(--s1)", "You added"], [d.earned, "var(--s2)", "Earned"]].forEach(([v, col, name], j) => {
      const x = cx + (j === 0 ? -bw - 2 : 2);
      const yTop = Math.min(Y(v), y0), h = Math.abs(Y(v) - y0);
      if (h > 0.5) bars += `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" rx="3" fill="${col}"
        data-tt="${d.label} · ${name}: ${fmtRs(v)}"/>`;
      else bars += `<rect x="${x}" y="${y0 - 1}" width="${bw}" height="2" fill="${col}" opacity=".4"
        data-tt="${d.label} · ${name}: ${fmtRs(v)}"/>`;
    });
    if (data.length <= 8 || i % 2 === 0)
      xl += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" class="hoverable" role="img" aria-label="Money added vs investment earnings per period">
    ${grid}${bars}
    <line x1="${P.l}" y1="${y0}" x2="${W - P.r}" y2="${y0}" stroke="var(--baseline)" stroke-width="1.5"/>${xl}</svg>`;
}

function viewReview() {
  const dates = snapDates();
  if (dates.length < 2)
    return `<div class="card"><div class="empty">The reconciliation statement needs at least two snapshots.<br>
      Record this month's snapshot first.</div></div>`;
  if (reviewIdx == null || reviewIdx < 1 || reviewIdx >= dates.length) reviewIdx = dates.length - 1;
  const prev = dates[reviewIdx - 1], cur = dates[reviewIdx];
  const opts = [];
  for (let i = dates.length - 1; i >= 1; i--)
    opts.push(`<option value="${i}" ${i === reviewIdx ? "selected" : ""}>${dates[i - 1]} → ${dates[i]}</option>`);

  let rows = "", tot = { open: 0, tin: 0, tout: 0, close: 0, earned: 0, unexpl: 0, income: 0, spend: 0 };
  for (const a of DB.accounts) {
    const open = valueAt(a.id, prev) || 0;
    const close = valueAt(a.id, cur) || 0;
    const b = flowBreakdown(a.id, prev, cur);
    const inn = b.income + b.transfer_in, out = b.spend + b.transfer_out;
    if (!open && !close && !inn && !out) continue;
    const residual = close - open - inn + out;
    const isEarn = !!EARN_TYPES[a.type] && open >= 0 && close >= 0; // liabilities are never "earnings"
    tot.open += open; tot.close += close; tot.tin += inn; tot.tout += out;
    tot.income += b.income; tot.spend += b.spend;
    if (isEarn) tot.earned += residual; else tot.unexpl += residual;
    const resCls = residual > 0 ? "delta-up" : residual < 0 ? "delta-down" : "muted";
    const resTag = isEarn ? "earned" : (Math.abs(residual) < 1 ? "reconciled ✓" : "unexplained");
    rows += `<tr>
      <td><span class="chip" style="background:${ACCT_TYPES[a.type].color}"></span>${esc(a.name)}</td>
      <td class="num">${fmtRs(open)}</td>
      <td class="num">${inn ? "+" + fmtRs(inn).replace("Rs ", "") : "—"}</td>
      <td class="num">${out ? "−" + fmtRs(out).replace("Rs ", "") : "—"}</td>
      <td class="num">${fmtRs(close)}</td>
      <td class="num ${resCls}">${Math.abs(residual) < 1 ? "" : fmtRs(residual)} <span class="tag">${resTag}</span></td>
    </tr>`;
  }
  const dNW = tot.close - tot.open;
  const unexplBad = Math.abs(tot.unexpl) >= 1;
  return `<div class="card"><h2>Reconciliation statement
      <span class="sub"><select style="width:auto;padding:4px 8px" onchange="reviewIdx=+this.value;render()">${opts.join("")}</select></span></h2>
    <p class="muted">Opening + money you added − money you took out should equal closing.
      The difference is <strong>earned</strong> for investments — and <strong>unexplained</strong> for bank/cash,
      i.e. money that moved without a ledger entry.</p>
    <table style="margin-top:10px"><thead><tr>
      <th>Account</th><th class="num">Opening</th><th class="num">My money in</th><th class="num">My money out</th>
      <th class="num">Closing</th><th class="num">Difference</th></tr></thead>
    <tbody>${rows}
      <tr style="font-weight:700"><td>Total</td><td class="num">${fmtRs(tot.open)}</td>
        <td class="num">${tot.tin ? "+" + fmtRs(tot.tin).replace("Rs ", "") : "—"}</td>
        <td class="num">${tot.tout ? "−" + fmtRs(tot.tout).replace("Rs ", "") : "—"}</td>
        <td class="num">${fmtRs(tot.close)}</td>
        <td class="num ${dNW >= 0 ? "delta-up" : "delta-down"}">${fmtRs(dNW)}</td></tr>
    </tbody></table></div>

    <div class="card"><h2>Where the change came from</h2>
      <table><tbody>
        <tr><td>Net worth change (${prev} → ${cur})</td><td class="num ${dNW >= 0 ? "delta-up" : "delta-down"}">${fmtRs(dNW)}</td></tr>
        <tr><td>Added (fresh money in)</td><td class="num">${fmtRs(tot.income)}</td></tr>
        <tr><td>Withdrawn (spending)</td><td class="num">${tot.spend ? "−" + fmtRs(tot.spend).replace("Rs ", "") : fmtRs(0)}</td></tr>
        <tr><td>Investments earned</td><td class="num ${tot.earned >= 0 ? "delta-up" : "delta-down"}">${fmtRs(tot.earned)}</td></tr>
        <tr><td>Unexplained (bank/cash moved without a ledger entry)</td>
          <td class="num ${unexplBad ? "delta-down" : "delta-up"}">${unexplBad ? fmtRs(tot.unexpl) : "Rs 0 ✓ fully reconciled"}</td></tr>
      </tbody></table>
      ${unexplBad ? `<p class="muted" style="margin-top:8px">To reconcile: add the missing income / spending / transfer
        entries in the Ledger for this period until Unexplained reads zero.</p>` : ""}
    </div>`;
}

/* ---------------- Zakat ---------------- */
let zakatDate = "", zakatRate = "2.5", zakatExclude = {};

function zakatAccount() {
  return DB.accounts.find(a => a.type === "liability" && /zakat/i.test(a.name)) || null;
}
function zakatOutstanding() {
  const za = zakatAccount(); if (!za) return 0;
  const bal = ledgerBalanceAt(za.id, "9999-12-31");
  return bal == null ? 0 : bal;   // stored negative; -50,000 means 50,000 still owed
}
function viewZakat() {
  if (!DB.accounts.length)
    return `<div class="card"><div class="empty">Add your accounts first.</div></div>`;
  const d = zakatDate || today();
  const rate = parseFloat(zakatRate) || 0;
  const za = zakatAccount();

  /* --- what's zakatable on that date --- */
  let rows = "", total = 0;
  for (const a of DB.accounts.filter(a => a.active !== false && a.type !== "liability")) {
    const v = valueAt(a.id, d);
    const inc = zakatExclude[a.id] != null ? !zakatExclude[a.id] : zakatIncluded(a);
    if (inc && v != null && v > 0) total += v;
    rows += `<tr>
      <td><label style="display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer">
        <input type="checkbox" style="width:auto" ${inc ? "checked" : ""}
          onchange="zakatExclude['${a.id}']=!this.checked;render()">
        <span class="chip" style="background:${ACCT_TYPES[a.type].color}"></span>${esc(a.name)}</label></td>
      <td><span class="tag">${ACCT_TYPES[a.type].label}</span></td>
      <td class="num ${inc ? "" : "muted"}">${v != null ? fmtRs(v) : "—"}</td></tr>`;
  }
  const due = Math.round(total * rate / 100);

  /* --- history from the ledger --- */
  let histRows = "", accrued = 0, paid = 0;
  if (za) {
    const mine = DB.txns.filter(t => t.account_id === za.id)
      .sort((a, b) => a.date < b.date ? 1 : -1);
    mine.forEach(t => {
      const isAccrual = t.kind === "spend";
      if (isAccrual) accrued += t.amount; else paid += t.amount;
      histRows += `<tr><td>${t.date}</td>
        <td><span class="kindpill">${isAccrual ? "Zakat due" : "Paid"}</span></td>
        <td class="num ${isAccrual ? "delta-down" : "delta-up"}">${isAccrual ? "−" : "+"}${fmtRs(t.amount).replace("Rs ", "")}</td>
        <td class="muted">${esc(t.note || "")}</td></tr>`;
    });
  }
  const outstanding = Math.abs(zakatOutstanding());
  const payAccts = DB.accounts.filter(a => a.active !== false && a.type !== "liability")
    .map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("");

  return `<div class="grid3">
    <div class="card"><h2>Zakat outstanding</h2>
      <div class="hero-value ${outstanding > 0 ? "delta-down" : "delta-up"}">${fmtRs(outstanding)}</div>
      <div class="hero-sub muted">${outstanding > 0 ? "still to be paid" : "nothing outstanding ✓"}</div></div>
    <div class="card"><h2>Total assessed</h2>
      <div class="hero-value">${fmtRs(accrued)}</div>
      <div class="hero-sub muted">across all years recorded</div></div>
    <div class="card"><h2>Total paid</h2>
      <div class="hero-value delta-up">${fmtRs(paid)}</div>
      <div class="hero-sub muted">${accrued ? Math.round(paid / accrued * 100) + "% of assessed" : "—"}</div></div>
  </div>

  <div class="card"><h2>Calculate zakat <span class="sub">on your wealth at a chosen date</span></h2>
    <div class="row" style="align-items:flex-end">
      <div style="max-width:190px"><label>Valuation date (e.g. 1 Ramadan)</label>
        <input type="date" value="${d}" onchange="zakatDate=this.value;render()"></div>
      <div style="max-width:130px"><label>Rate %</label>
        <input type="number" step="0.001" value="${esc(zakatRate)}" onchange="zakatRate=this.value;render()"></div>
      <div class="muted" style="font-size:12px">2.5% is the common lunar-year rate; some use 2.577% for a solar year.
        Tick the accounts your zakat applies to — follow your own scholar's guidance.</div>
    </div>
    <table style="margin-top:12px"><thead><tr><th>Account</th><th>Type</th><th class="num">Value on ${d}</th></tr></thead>
      <tbody>${rows}
      <tr style="font-weight:700"><td colspan="2">Zakatable wealth</td><td class="num">${fmtRs(total)}</td></tr>
      <tr style="font-weight:700"><td colspan="2">Zakat @ ${rate}%</td><td class="num delta-down">${fmtRs(due)}</td></tr>
      </tbody></table>
    <p style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn" onclick="recordZakat(${due},'${d}')" ${due > 0 ? "" : "disabled"}>Record Rs ${due.toLocaleString("en-PK")} as payable</button>
      <span class="muted" style="font-size:12px">Creates a “Zakat payable” liability — your net worth drops by this amount.</span></p>
    ${total === 0 ? `<p class="muted" style="margin-top:6px">No values on that date — record a snapshot for that date first.</p>` : ""}
  </div>

  ${za ? `<div class="card"><h2>Record a payment <span class="sub">as you pay it out over the year</span></h2>
    <div class="row" style="align-items:flex-end">
      <div style="max-width:240px"><label>Paid from</label><select id="zkFrom">${payAccts}</select></div>
      <div style="max-width:150px"><label>Date</label><input type="date" id="zkDate" value="${today()}"></div>
      <div style="max-width:170px"><label>Amount (Rs)</label><input type="number" step="any" id="zkAmt" placeholder="50000"></div>
      <div style="max-width:220px"><label>Note</label><input id="zkNote" placeholder="e.g. to Edhi / relative"></div>
      <div><button class="btn" onclick="recordZakatPayment()">Add payment</button></div>
    </div>
    <p class="muted" style="margin-top:8px">Money leaves the account and reduces what you owe — your net worth
      doesn't change, because the obligation was already counted when you recorded it.</p></div>` : ""}

  ${histRows ? `<div class="card"><h2>Zakat history</h2>
    <table><thead><tr><th>Date</th><th>Type</th><th class="num">Amount</th><th>Note</th></tr></thead>
    <tbody>${histRows}</tbody></table></div>` : ""}`;
}

async function recordZakat(amount, date) {
  if (!amount || amount <= 0) return toast("Nothing to record");
  if (!confirm(`Record ${fmtRs(amount)} as zakat payable on ${date}?\n\nYour net worth will drop by this amount.`)) return;
  let za = zakatAccount();
  if (!za) {
    za = { id: uid(), name: "Zakat payable", type: "liability", active: true, zakat_include: false };
    DB.accounts.push(za); await persistInsert("accounts", za);
  }
  const row = { id: uid(), account_id: za.id, kind: "spend", date, amount,
    note: `Zakat assessed on ${date}`, category: "Zakat assessed" };
  DB.txns.push(row); await persistInsert("transactions", row);
  /* a liability's balance is exactly known, so snapshot it straight away —
     that's what makes net worth reflect it */
  try { await upsertSnapshot(za.id, date, ledgerBalanceAt(za.id, date)); }
  catch (e) { alert("Recorded, but the snapshot failed:\n\n" + e.message); }
  if (!isCloud()) localSave();
  toast(`Zakat of ${fmtRs(amount)} recorded`); render();
}

async function recordZakatPayment() {
  const za = zakatAccount(); if (!za) return;
  const amt = parseFloat(document.getElementById("zkAmt").value);
  if (!amt || amt <= 0) return toast("Enter an amount");
  const from = document.getElementById("zkFrom").value;
  const date = document.getElementById("zkDate").value;
  const note = document.getElementById("zkNote").value || "Zakat payment";
  const g = uid();
  const out = { id: uid(), account_id: from, kind: "transfer_out", date, amount: amt,
    note, category: "Charity / Zakat", group_id: g };
  const into = { id: uid(), account_id: za.id, kind: "transfer_in", date, amount: amt,
    note, category: "Charity / Zakat", group_id: g };
  DB.txns.push(out, into);
  await persistInsert("transactions", out); await persistInsert("transactions", into);
  /* deliberately no snapshot here: a payment moves TWO accounts (bank down, liability down).
     Snapshotting only the liability would inflate net worth until the next real snapshot,
     so both are captured at the next month-end instead. Outstanding zakat below is read
     from the ledger, so it updates immediately regardless. */
  if (!isCloud()) localSave();
  toast(`Payment of ${fmtRs(amt)} recorded`); render();
}

/* ---------------- charts (hand-rolled SVG) ---------------- */
function lineChart(series) {
  const W = 900, H = 260, P = { l: 60, r: 16, t: 14, b: 30 };
  const xs = series.map((_, i) => i);
  const vals = series.map(s => s.value);
  const vmin = Math.min(...vals), vmax = Math.max(...vals);
  const pad = (vmax - vmin) * 0.1 || vmax * 0.1 || 1;
  const y0 = Math.max(0, vmin - pad), y1 = vmax + pad;
  const X = i => P.l + (xs.length === 1 ? 0 : i / (xs.length - 1)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  const pts = series.map((s, i) => `${X(i).toFixed(1)},${Y(s.value).toFixed(1)}`).join(" ");
  let grid = "", labels = "";
  for (let g = 0; g <= 3; g++) {
    const v = y0 + (y1 - y0) * g / 3, y = Y(v);
    grid += `<line x1="${P.l}" y1="${y}" x2="${W - P.r}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    labels += `<text x="${P.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtRs(v, true)}</text>`;
  }
  const step = Math.max(1, Math.ceil(series.length / 8));
  let xlabels = "";
  series.forEach((s, i) => {
    if (i % step === 0 || i === series.length - 1)
      xlabels += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${s.date.slice(2, 7)}</text>`;
  });
  const dots = series.map((s, i) =>
    `<circle cx="${X(i)}" cy="${Y(s.value)}" r="10" fill="transparent" data-tt="${s.date}: ${fmtRs(s.value)}" data-cx="${X(i)}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" class="hoverable" role="img" aria-label="Net worth trend">
    ${grid}${labels}${xlabels}
    <polyline points="${pts}" fill="none" stroke="var(--seq)" stroke-width="2" stroke-linejoin="round"/>
    ${series.map((s, i) => `<circle cx="${X(i)}" cy="${Y(s.value)}" r="3.5" fill="var(--seq)" stroke="var(--surface-1)" stroke-width="2"/>`).join("")}
    ${dots}</svg>`;
}

function barChart(data) {
  const W = 460, H = 200, P = { l: 54, r: 8, t: 12, b: 26 };
  const vmax = Math.max(...data.map(d => d.value)) * 1.15 || 1;
  const bw = Math.min(40, (W - P.l - P.r) / data.length - 6);
  const X = i => P.l + (i + 0.5) * ((W - P.l - P.r) / data.length);
  const Y = v => P.t + (1 - v / vmax) * (H - P.t - P.b);
  let grid = "";
  for (let g = 0; g <= 2; g++) {
    const v = vmax * g / 2, y = Y(v);
    grid += `<line x1="${P.l}" y1="${y}" x2="${W - P.r}" y2="${y}" stroke="var(--grid)"/>
      <text x="${P.l - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtRs(v, true)}</text>`;
  }
  let bars = "", xl = "";
  data.forEach((d, i) => {
    const y = Y(d.value), h = H - P.b - y;
    bars += `<path d="M${X(i) - bw / 2},${H - P.b} v${-(h - 4)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${h - 4} z"
      fill="var(--seq)" data-tt="${d.month}: ${fmtRs(d.value)}"/>`;
    if (data.length <= 8 || i % 2 === 0)
      xl += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.month.slice(2)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" class="hoverable" role="img" aria-label="Monthly spending">${grid}${bars}${xl}</svg>`;
}

function donutChart(alloc, total) {
  const entries = Object.entries(alloc).sort((a, b) => b[1] - a[1]);
  const R = 70, r = 44, cx = 90, cy = 90;
  let angle = -Math.PI / 2, paths = "";
  for (const [type, v] of entries) {
    const frac = v / total, a2 = angle + frac * Math.PI * 2;
    const large = frac > 0.5 ? 1 : 0;
    const gap = 0.02; // ~2px surface gap between segments
    const x1 = cx + R * Math.cos(angle + gap), y1 = cy + R * Math.sin(angle + gap);
    const x2 = cx + R * Math.cos(a2 - gap), y2 = cy + R * Math.sin(a2 - gap);
    const x3 = cx + r * Math.cos(a2 - gap), y3 = cy + r * Math.sin(a2 - gap);
    const x4 = cx + r * Math.cos(angle + gap), y4 = cy + r * Math.sin(angle + gap);
    paths += `<path d="M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${large} 0 ${x4},${y4} z"
      fill="${ACCT_TYPES[type].color}" data-tt="${ACCT_TYPES[type].label}: ${fmtRs(v)} (${(frac * 100).toFixed(1)}%)"/>`;
    angle = a2;
  }
  const legend = entries.map(([type, v]) =>
    `<span><span class="chip" style="background:${ACCT_TYPES[type].color}"></span>${ACCT_TYPES[type].label}
     <strong>${(v / total * 100).toFixed(0)}%</strong></span>`).join("");
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 180 180" style="width:170px" class="hoverable" role="img" aria-label="Asset allocation">${paths}
      <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${fmtRs(total, true)}</text>
      <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="10" fill="var(--muted)">total</text></svg>
    <div class="legend" style="flex-direction:column;gap:6px">${legend}</div></div>`;
}

function attachChartHovers() {
  const tt = document.getElementById("tt");
  document.querySelectorAll(".hoverable [data-tt]").forEach(el => {
    el.addEventListener("mousemove", e => {
      tt.textContent = el.getAttribute("data-tt");
      tt.style.display = "block";
      tt.style.left = Math.min(e.clientX + 12, window.innerWidth - 180) + "px";
      tt.style.top = (e.clientY - 34) + "px";
    });
    el.addEventListener("mouseleave", () => tt.style.display = "none");
  });
}

/* ---------------- Ledger ---------------- */
function openLedger(id) { ledgerFilter = id; nav("Ledger"); }

function setRange(preset) {
  const now = new Date(), iso = isoDate;
  if (preset === "all") { ledgerFrom = ledgerTo = ""; }
  else if (preset === "month") {
    ledgerFrom = iso(new Date(now.getFullYear(), now.getMonth(), 1)); ledgerTo = iso(now);
  } else if (preset === "3m") {
    ledgerFrom = iso(new Date(now.getFullYear(), now.getMonth() - 2, 1)); ledgerTo = iso(now);
  } else if (preset === "fy") {           // Pakistan FY: 1 July → 30 June
    const y = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
    ledgerFrom = `${y}-07-01`; ledgerTo = `${y + 1}-06-30`;
  }
  render();
}

/* Added / withdrawn in the selected range, grouped by the note = "what it was for" */
function purposeReport(txns) {
  const inRange = ledgerFrom || ledgerTo;
  const label = ledgerFrom && ledgerTo ? `${ledgerFrom} → ${ledgerTo}`
    : ledgerFrom ? `since ${ledgerFrom}` : ledgerTo ? `up to ${ledgerTo}` : "all time";
  const fy = (() => { const n = new Date(); const y = n.getMonth() >= 6 ? n.getFullYear() : n.getFullYear() - 1;
    return `${String(y).slice(2)}-${String(y + 1).slice(2)}`; })();

  const catOpts = `<option value="">All categories</option>` +
    [...allCats(), "(uncategorised)"].map(c =>
      `<option value="${esc(c)}" ${ledgerCat === c ? "selected" : ""}>${esc(c)}</option>`).join("");

  const picker = `<div class="row" style="align-items:flex-end">
    <div style="max-width:170px"><label>From</label>
      <input type="date" value="${ledgerFrom}" onchange="ledgerFrom=this.value;render()"></div>
    <div style="max-width:170px"><label>To</label>
      <input type="date" value="${ledgerTo}" onchange="ledgerTo=this.value;render()"></div>
    <div style="max-width:210px"><label>Category</label>
      <select onchange="ledgerCat=this.value;render()">${catOpts}</select></div>
    <div style="flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn secondary" style="padding:6px 12px" onclick="setRange('month')">This month</button>
      <button class="btn secondary" style="padding:6px 12px" onclick="setRange('3m')">Last 3 months</button>
      <button class="btn secondary" style="padding:6px 12px" onclick="setRange('fy')">FY ${fy}</button>
      <button class="btn secondary" style="padding:6px 12px" onclick="setRange('all')">All time</button>
    </div></div>
    ${ledgerCat ? `<p style="margin-top:10px"><span class="kindpill" style="border-color:var(--accent);color:var(--accent)">
      Category: ${esc(ledgerCat)}</span>
      <button class="btn secondary" style="padding:2px 10px;font-size:11px;margin-left:6px"
        onclick="ledgerCat='';render()">Clear</button></p>` : ""}`;

  const sum = k => txns.filter(t => t.kind === k).reduce((s, t) => s + t.amount, 0);
  const added = sum("income"), withdrawn = sum("spend");
  const xin = sum("transfer_in"), xout = sum("transfer_out");

  /* group by category normally; once a category is selected, group by note within it */
  const groupKey = t => ledgerCat ? ((t.note || "(no note)").trim() || "(no note)")
                                  : (t.category || "(uncategorised)");
  const byPurpose = kind => {
    const m = {};
    txns.filter(t => t.kind === kind).forEach(t => {
      const key = groupKey(t);
      if (!m[key]) m[key] = { total: 0, n: 0 };
      m[key].total += t.amount; m[key].n++;
    });
    return Object.entries(m).sort((a, b) => b[1].total - a[1].total);
  };
  const tbl = (title, list, total, cls) => {
    if (!list.length) return `<div><h2>${title}</h2><p class="muted">Nothing in this range.</p></div>`;
    const shown = list.slice(0, 12);
    const rest = list.slice(12).reduce((s, [, v]) => s + v.total, 0);
    return `<div><h2>${title} <span class="sub">${fmtRs(total)}</span></h2>
      <table><tbody>${shown.map(([name, v]) => `<tr>
        <td>${ledgerCat ? esc(name)
          : `<span class="acct-link" onclick="ledgerCat='${esc(name).replace(/'/g, "\\'")}';render()">${esc(name)}</span>`}${v.n > 1 ? ` <span class="tag">×${v.n}</span>` : ""}</td>
        <td class="num ${cls}">${fmtRs(v.total)}</td>
        <td class="num muted" style="width:52px">${total ? Math.round(v.total / total * 100) : 0}%</td></tr>`).join("")}
        ${rest ? `<tr><td class="muted">other ${list.length - 12} items</td>
          <td class="num muted">${fmtRs(rest)}</td><td></td></tr>` : ""}
      </tbody></table></div>`;
  };

  return `<div class="card"><h2>Money in &amp; out <span class="sub">${esc(label)}</span></h2>
    ${picker}
    <div class="grid4" style="margin-top:16px">
      <div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.07em">Added</div>
        <div style="font-size:20px;font-weight:750" class="delta-up">${fmtRs(added)}</div></div>
      <div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.07em">Withdrawn</div>
        <div style="font-size:20px;font-weight:750" class="delta-down">${fmtRs(withdrawn)}</div></div>
      <div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.07em">Net own money</div>
        <div style="font-size:20px;font-weight:750">${fmtRs(added - withdrawn)}</div></div>
      <div><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.07em">Transfers moved</div>
        <div style="font-size:20px;font-weight:750">${fmtRs(Math.max(xin, xout))}</div>
        <div class="muted" style="font-size:11px">between your own accounts</div></div>
    </div>
    ${inRange || txns.length ? `<div class="grid2" style="margin-top:18px">
      ${tbl(ledgerCat ? "Added — notes" : "Added — by category", byPurpose("income"), added, "delta-up")}
      ${tbl(ledgerCat ? "Withdrawn — notes" : "Withdrawn — by category", byPurpose("spend"), withdrawn, "delta-down")}
    </div>
    <p class="muted" style="margin-top:10px">${ledgerCat
      ? "Showing notes inside this category. Clear the category to see all categories."
      : "Click any category to drill into it — the ledger below filters too."}</p>` : ""}
  </div>`;
}

    ${catDatalist("dlXfer", "transfer_out")}

    <p style="margin-top:12px"><button class="btn" onclick="addTransfer()">Add transfer</button></p>
    <p class="muted" style="margin-top:8px">Use this for: bank → brokerage funding, fixed-income deposits/withdrawals,
    dividends paid into your bank, etc.</p>
  </div></div>`;

  /* list */
  const filterOpts = `<option value="">All accounts</option>` + DB.accounts
    .map(a => `<option value="${a.id}" ${ledgerFilter === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("");
  const ordAll = {}; DB.txns.forEach((t, i) => ordAll[t.id] = i);
  let txns = [...DB.txns].sort((a, b) =>
    a.date < b.date ? 1 : a.date > b.date ? -1 : ordAll[b.id] - ordAll[a.id]);
  if (ledgerFilter) txns = txns.filter(t => t.account_id === ledgerFilter);
  if (ledgerFrom) txns = txns.filter(t => t.date >= ledgerFrom);
  if (ledgerTo) txns = txns.filter(t => t.date <= ledgerTo);
  if (ledgerCat) txns = txns.filter(t => (t.category || "(uncategorised)") === ledgerCat);
  if (ledgerSearch) {
    const q = ledgerSearch.toLowerCase();
    txns = txns.filter(t => (t.note || "").toLowerCase().includes(q) ||
      String(t.amount).includes(q) || t.date.includes(q) ||
      acctName(t.account_id).toLowerCase().includes(q));
  }

  html += purposeReport(txns);

  html += `<div class="card"><h2>Ledger
    <span class="sub"><select style="width:auto;padding:4px 8px" onchange="ledgerFilter=this.value||null;render()">${filterOpts}</select>
    <input style="width:200px;padding:4px 10px;margin-left:8px;display:inline-block" placeholder="Search note, amount, date…"
      value="${esc(ledgerSearch)}" oninput="ledgerSearch=this.value;clearTimeout(window._lst);window._lst=setTimeout(render,300)"></span></h2>`;
  if (!txns.length) html += `<div class="empty">No transactions yet.</div>`;
  else {
    /* running balance — only meaningful for a single account.
       Computed over ALL that account's entries (not the search subset) so the
       figure stays true even while filtering, exactly like a bank statement. */
    let balMap = null, opening = 0;
    if (ledgerFilter) {
      const ord = {}; DB.txns.forEach((t, i) => ord[t.id] = i);   // import order
      const all = DB.txns.filter(t => t.account_id === ledgerFilter)
        .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : ord[a.id] - ord[b.id]);
      if (all.length) {
        const snapsBefore = DB.snapshots
          .filter(s => s.account_id === ledgerFilter && s.date < all[0].date)
          .sort((a, b) => a.date < b.date ? -1 : 1);
        opening = snapsBefore.length ? snapsBefore[snapsBefore.length - 1].value : 0;
      }
      let run = opening; balMap = {};
      all.forEach(t => { run += TXN_KINDS[t.kind].sign * t.amount; balMap[t.id] = run; });
    }

    const inSum = txns.filter(t => TXN_KINDS[t.kind].sign > 0).reduce((s, t) => s + t.amount, 0);
    const outSum = txns.filter(t => TXN_KINDS[t.kind].sign < 0).reduce((s, t) => s + t.amount, 0);
    html += `<p class="muted" style="margin-bottom:8px"><strong>${txns.length}</strong> entr${txns.length === 1 ? "y" : "ies"}
      · in ${fmtRs(inSum)} · out ${fmtRs(outSum)} · net <strong>${fmtRs(inSum - outSum)}</strong>
      ${ledgerFilter && opening ? ` · opening ${fmtRs(opening)}` : ""}</p>`;

    const shown = txns.slice(0, ledgerLimit);
    html += `<table><thead><tr><th>Date</th><th>Account</th><th>Type</th><th class="num">Amount</th>
      ${balMap ? `<th class="num">Balance</th>` : ""}<th>Category</th><th>Note</th><th></th></tr></thead><tbody>`;
    for (const t of shown) {
      const k = TXN_KINDS[t.kind];
      html += `<tr><td>${t.date}</td><td>${esc(acctName(t.account_id))}</td>
        <td><span class="kindpill">${k.label.split(" — ")[0].split(" (")[0]}</span></td>
        <td class="num ${k.sign > 0 ? "delta-up" : "delta-down"}">${k.sign > 0 ? "+" : "−"}${fmtRs(t.amount).replace("Rs ", "")}</td>
        ${balMap ? `<td class="num">${fmtRs(balMap[t.id])}</td>` : ""}
        <td>${t.category ? `<span class="acct-link" onclick="ledgerCat='${esc(t.category).replace(/'/g, "\\'")}';render()">${esc(t.category)}</span>` : `<span class="tag">—</span>`}</td>
        <td class="muted">${esc(t.note || "")}</td>
        <td style="white-space:nowrap">
          <button class="btn secondary" style="padding:2px 8px;font-size:11px" onclick="openTxnEdit('${t.id}')">✎</button>
          <button class="btn danger" style="padding:2px 8px;font-size:11px" onclick="delTxn('${t.id}')">✕</button></td></tr>`;
    }
    html += `</tbody></table>`;
    if (txns.length > shown.length)
      html += `<p style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="muted">Showing ${shown.length} of ${txns.length}</span>
        <button class="btn secondary" onclick="ledgerLimit+=200;render()">Show 200 more</button>
        <button class="btn secondary" onclick="ledgerLimit=1e9;render()">Show all</button></p>`;
    else if (txns.length > 200)
      html += `<p class="muted" style="margin-top:8px">Showing all ${txns.length}.
        <button class="btn secondary" style="padding:2px 10px;font-size:11px" onclick="ledgerLimit=200;render()">Collapse</button></p>`;
  }
  html += `</div>`;
  return html;
}

async function delTxn(id) {

/* ---------------- Snapshot ---------------- */
function viewSnapshot() {
  if (!DB.accounts.length)
    return `<div class="card"><div class="empty">Add accounts first.</div></div>`;
  const dates = snapDates();
  const defDate = snapDateSel || today();
  const editing = dates.includes(defDate); // picking a past snapshot date = edit it
  const lastD = dates.filter(d => d < defDate).slice(-1)[0] || null;
  let rows = "";
  for (const a of DB.accounts.filter(a => a.active !== false)) {
    const prevV = lastD ? valueAt(a.id, lastD) : null;
    const flow = lastD ? flowsBetween(a.id, lastD, defDate) : 0;
    const existing = editing ? DB.snapshots.find(s => s.date === defDate && s.account_id === a.id) : null;
    const info = ledgerBalanceInfo(a.id, defDate);
    const ledgerBal = info && info.hasOpening ? info.value : null;   // only trustworthy with an opening
    const suggested = existing ? existing.value : (prevV != null ? prevV + flow : (ledgerBal != null ? ledgerBal : ""));
    rows += `<tr><td><span class="chip" style="background:${ACCT_TYPES[a.type].color}"></span>${esc(a.name)}</td>
      <td class="num muted">${prevV != null ? fmtRs(prevV) : "—"}</td>
      <td class="num muted">${flow ? (flow > 0 ? "+" : "−") + fmtRs(Math.abs(flow)).replace("Rs ", "") : "—"}</td>
      <td class="num">${ledgerBal != null
        ? `<span class="acct-link" title="Click to use this value" onclick="useLedgerBal('${a.id}',${ledgerBal})">${fmtRs(ledgerBal)}</span>`
        : info
          ? `<span class="muted" title="No opening balance recorded before ${info.firstDate}, so this is only the net of your entries">
               ${fmtRs(info.value)} <span class="tag">net flows only</span></span>`
          : `<span class="muted">—</span>`}</td>
      <td style="max-width:160px"><input type="number" step="any" class="snapVal" data-acct="${a.id}"
        value="${suggested !== "" ? Math.round(suggested) : ""}" placeholder="current value"></td></tr>`;
  }
  return `<div class="card"><h2>${editing ? "Edit snapshot" : "Monthly snapshot"} <span class="sub">${editing ? "existing values loaded — change and re-save" : "mark everything to market"}</span></h2>
    <p class="muted">Prefilled with last snapshot + ledger flows since — for <strong>bank and cash</strong> accounts
    that already equals the ledger closing balance, so just confirm it. For <strong>investments</strong> overwrite with
    the real market value (broker app total, fixed-income statement); the difference becomes your measured return.
    Click a <span class="acct-link">ledger balance</span> to copy it into the box. Pick a past date to edit that snapshot.</p>
    <div class="row" style="margin:12px 0"><div style="max-width:200px"><label>Snapshot date</label>
      <input type="date" id="snapDate" value="${defDate}" onchange="snapDateSel=this.value;render()"></div></div>
    <table><thead><tr><th>Account</th><th class="num">Last (${lastD || "none"})</th><th class="num">Flows since</th>
      <th class="num">Ledger balance</th><th>Value now</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" onclick="saveSnapshot()">Save snapshot</button></p></div>
    ${snapHistoryHtml()}`;
}
function snapHistoryHtml() {
  const dates = snapDates().slice().reverse();
  if (!dates.length) return "";
  let html = `<div class="card"><h2>Snapshot history</h2><table><thead><tr><th>Date</th><th class="num">Net worth</th><th class="num">Change</th><th></th></tr></thead><tbody>`;
  const series = netWorthSeries();
  const byDate = Object.fromEntries(series.map(s => [s.date, s.value]));
  dates.forEach((d, i) => {
    const prev = dates[i + 1];
    const chg = prev != null ? byDate[d] - byDate[prev] : null;
    html += `<tr><td><span class="acct-link" onclick="snapDateSel='${d}';render();window.scrollTo(0,0)">${d}</span></td>
      <td class="num">${fmtRs(byDate[d])}</td>
      <td class="num ${chg != null ? (chg >= 0 ? "delta-up" : "delta-down") : ""}">${chg != null ? fmtRs(chg) : "—"}</td>
      <td><button class="btn danger" style="padding:2px 8px;font-size:11px" onclick="delSnapshot('${d}')">✕</button></td></tr>`;
  });
  return html + `</tbody></table></div>`;
}
function useLedgerBal(acctId, v) {
  const inp = document.querySelector(`.snapVal[data-acct="${acctId}"]`);
  if (inp) { inp.value = Math.round(v); inp.focus(); }
}
async function saveSnapshot() {
  const date = document.getElementById("snapDate").value;
  if (!date) return toast("Pick a date");
  const inputs = [...document.querySelectorAll(".snapVal")];
  let n = 0, err = "";
  for (const inp of inputs) {
    const v = parseFloat(inp.value);
    if (isNaN(v)) continue;
    try { await upsertSnapshot(inp.getAttribute("data-acct"), date, v); n++; }
    catch (e) { err = e.message || String(e); }
  }
  if (err) { alert("Snapshot could not be saved:\n\n" + err); return; }
  toast(`Snapshot saved (${n} accounts)`); nav("Dashboard");
}
async function delSnapshot(date) {
  if (!confirm(`Delete all snapshot entries for ${date}?`)) return;
  const rows = DB.snapshots.filter(s => s.date === date);
  for (const r of rows) { DB.snapshots = DB.snapshots.filter(s => s.id !== r.id); await persistDelete("snapshots", r.id); }
  render();
}

async function delAccount(id) {

  if (!confirm(`Delete this account AND its ${nTx} transactions + ${nSn} snapshot entries? Archive is usually safer.`)) return;
  for (const t of DB.txns.filter(t => t.account_id === id)) await persistDelete("transactions", t.id);
  for (const s of DB.snapshots.filter(s => s.account_id === id)) await persistDelete("snapshots", s.id);
  DB.txns = DB.txns.filter(t => t.account_id !== id);
  DB.snapshots = DB.snapshots.filter(s => s.account_id !== id);
  DB.accounts = DB.accounts.filter(a => a.id !== id);
  await persistDelete("accounts", id);
  render();
}

const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
function parseDateCell(s) {
  s = String(s || "").trim().replace(/^["']|["']$/g, "");
  const y4 = y => (y.length === 2 ? (Number(y) > 70 ? "19" + y : "20" + y) : y);
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);          // 2026-07-01
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);            // 01/07/2026 (dd/mm/yyyy)
  if (m) return `${y4(m[3])}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[-\s]([A-Za-z]{3,})[-\s](\d{2,4})$/);         // 01-Jul-2026
  if (m && MONTHS[m[2].slice(0, 3).toLowerCase()])
    return `${y4(m[3])}-${String(MONTHS[m[2].slice(0, 3).toLowerCase()]).padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  m = s.match(/^([A-Za-z]{3,})[-\s](\d{1,2}),?[-\s](\d{2,4})$/);       // Jul 01, 2026
  if (m && MONTHS[m[1].slice(0, 3).toLowerCase()])
    return `${y4(m[3])}-${String(MONTHS[m[1].slice(0, 3).toLowerCase()]).padStart(2, "0")}-${m[2].padStart(2, "0")}`;
  return null;
}

/* An identical account+type+date+amount+note is treated as one logical entry — for
   transfers, both legs are grouped and removed together so pairing never breaks. */
function findDuplicateTxns(scopeAccountId) {
  const scope = DB.txns.filter(t => !scopeAccountId || t.account_id === scopeAccountId);
  const seenGroups = new Set();
  const logical = [];
  for (const t of scope) {
    if (t.group_id) {
      if (seenGroups.has(t.group_id)) continue;
      seenGroups.add(t.group_id);
      const pair = DB.txns.filter(x => x.group_id === t.group_id);
      const accts = pair.map(p => p.account_id).sort().join(",");
      logical.push({ key: `xfer|${accts}|${t.date}|${Math.round(t.amount * 100)}|${(t.note || "").trim()}`,
        ids: pair.map(p => p.id), label: `Transfer ${fmtRs(t.amount)} · ${t.date} · ${(t.note || "no note").slice(0, 60)}` });
    } else {
      logical.push({ key: `${t.account_id}|${t.kind}|${t.date}|${Math.round(t.amount * 100)}|${(t.note || "").trim()}`,
        ids: [t.id], label: `${TXN_KINDS[t.kind].label.split(" ")[0]} ${fmtRs(t.amount)} · ${t.date} · ${(t.note || "no note").slice(0, 60)}` });
    }
  }
  const groups = {};
  logical.forEach(l => (groups[l.key] ||= []).push(l));
  const toDelete = [], examples = [];
  for (const key in groups) {
    const arr = groups[key];
    if (arr.length > 1) {
      for (let i = 1; i < arr.length; i++) toDelete.push(...arr[i].ids);
      if (examples.length < 8) examples.push({ label: arr[0].label, count: arr.length });
    }
  }
  return { toDelete, examples, groupsAffected: Object.values(groups).filter(a => a.length > 1).length };
}

const dayBefore = iso => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() - 1); return isoDate(d); };
function splitCsvLine(line) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if ((c === "," || c === "\t") && !q) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur); return out.map(s => s.trim());
}
function parseAmt(s) {
  if (s == null) return NaN;
  let t = String(s).replace(/["'\s]/g, "").replace(/[A-Za-z₨]/g, "").replace(/,/g, "");
  let neg = /^\(.*\)$/.test(t); t = t.replace(/[()]/g, "");
  const v = parseFloat(t);
  return isNaN(v) ? NaN : (neg ? -v : v);
}
function handleBankFile(ev) {

function parseBankCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const rows = lines.map(splitCsvLine);
  // header = first row containing a "date"-like cell and no parseable amount
  let hi = rows.findIndex(r => r.some(c => /date/i.test(c)));
  if (hi < 0) hi = 0;
  const head = rows[hi].map(h => h.toLowerCase());
  const find = (...keys) => head.findIndex(h => keys.some(k => h.includes(k)));
  const ci = {
    date: find("date", "trans date", "value date"),
    desc: find("desc", "particular", "narration", "detail", "remark", "reference"),
    debit: find("debit", "withdraw", "dr amount", "paid out", "outflow"),
    credit: find("credit", "deposit", "cr amount", "paid in", "inflow"),
    amount: find("amount", "transaction amount"),
    balance: find("available balance", "running balance", "balance"),
  };
  if (ci.date < 0) ci.date = 0;
  bankRows = []; bankOpening = null; bankClosing = null;
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const date = parseDateCell(r[ci.date]);
    if (!date) continue;
    /* opening / closing balance lines carry no debit or credit — capture them as snapshots */
    const desc = (ci.desc >= 0 ? r[ci.desc] : "").toLowerCase();
    const bal = ci.balance >= 0 ? parseAmt(r[ci.balance]) : NaN;
    if (!isNaN(bal)) {
      if (/opening\s*balance|b\/f|brought forward/.test(desc)) { bankOpening = { date, value: bal }; continue; }
      if (/closing\s*balance|c\/f|carried forward/.test(desc)) { bankClosing = { date, value: bal }; continue; }
    }
    let amt = NaN, kind = "spend";
    const d = ci.debit >= 0 ? parseAmt(r[ci.debit]) : NaN;
    const c = ci.credit >= 0 ? parseAmt(r[ci.credit]) : NaN;
    if (!isNaN(d) && Math.abs(d) > 0) { amt = Math.abs(d); kind = "spend"; }
    else if (!isNaN(c) && Math.abs(c) > 0) { amt = Math.abs(c); kind = "income"; }
    else if (ci.amount >= 0) {
      const a = parseAmt(r[ci.amount]);
      if (!isNaN(a) && a !== 0) { amt = Math.abs(a); kind = a < 0 ? "spend" : "income"; }
    }
    if (isNaN(amt) || amt === 0) continue;
    bankRows.push({ date, amount: amt, kind,
      note: (ci.desc >= 0 ? r[ci.desc] : "").replace(/\s+/g, " ").slice(0, 120),
      statementBalance: isNaN(bal) ? null : bal });
  }
  bankRows.sort((a, b) => a.date < b.date ? -1 : 1);
}

/* Upsert a snapshot. Uses Supabase upsert on (user_id, account_id, date) so a row that
   already exists in the cloud — but isn't in memory — updates instead of erroring. */
async function upsertSnapshot(accountId, date, value) {
  const existing = DB.snapshots.find(s => s.date === date && s.account_id === accountId);
  if (existing) existing.value = value;
  else DB.snapshots.push({ id: uid(), date, account_id: accountId, value });
  if (isCloud() && supaUser) {
    const row = DB.snapshots.find(s => s.date === date && s.account_id === accountId);
    const { error } = await supa.from("snapshots")
      .upsert({ id: row.id, date, account_id: accountId, value, user_id: supaUser.id },
              { onConflict: "user_id,account_id,date" });
    if (error) throw new Error(error.message);
  } else localSave();
}
let bankImporting = false;
async function importBankRows() {
  if (bankImporting) return;   // guards against a double-click firing two overlapping imports
  const acct = document.getElementById("bankAcct").value;
  if (!acct) return toast("Choose which account this statement belongs to");
  bankImporting = true;
  const btn = document.getElementById("bankImportBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Importing…"; }
  try {
    let snaps = 0, snapErr = "";
    const oc = document.getElementById("useOpening"), cc = document.getElementById("useClosing");
    try {
      if (bankOpening && oc && oc.checked) { await upsertSnapshot(acct, dayBefore(bankOpening.date), bankOpening.value); snaps++; }
      if (bankClosing && cc && cc.checked) { await upsertSnapshot(acct, bankClosing.date, bankClosing.value); snaps++; }
    } catch (e) {
      snapErr = e.message || String(e);
      console.error("snapshot save failed", e);
    }
    let added = 0, skipped = 0, dupes = 0;
    /* Count-based duplicate check: if the statement has 3 identical rows and 2 are already
       stored, import 1 — genuine repeat charges survive, re-uploads don't double-count. */
    const sig = t => `${t.date}|${Math.round(t.amount * 100)}|${(t.note || "").trim()}`;
    const have = {};
    DB.txns.filter(t => t.account_id === acct).forEach(t => { const k = sig(t); have[k] = (have[k] || 0) + 1; });
    const toInsert = [];
    const batchId = uid();
    for (const r of bankRows) {
      if (r.kind === "skip") { skipped++; continue; }
      const k = sig(r);
      if (have[k]) { have[k]--; dupes++; continue; }
      if (r.kind === "income" || r.kind === "spend") {
        const row = { id: uid(), account_id: acct, kind: r.kind, date: r.date, amount: r.amount,
          note: r.note || null, category: r.category || null, import_batch: batchId };
        DB.txns.push(row); toInsert.push(row); added++;
      } else {
        const [dir, other] = r.kind.split(":");
        const g = uid();
        const mine = { id: uid(), account_id: acct, kind: dir === "xout" ? "transfer_out" : "transfer_in",
          date: r.date, amount: r.amount, note: r.note || null, category: r.category || null, group_id: g, import_batch: batchId };
        const theirs = { id: uid(), account_id: other, kind: dir === "xout" ? "transfer_in" : "transfer_out",
          date: r.date, amount: r.amount, note: r.note || null, category: r.category || null, group_id: g, import_batch: batchId };
        DB.txns.push(mine, theirs); toInsert.push(mine, theirs); added++;
      }
    }
    if (isCloud() && supaUser) await persistInsertMany("transactions", toInsert);
    else localSave();
    if (added > 0) {
      DB.importBatches[batchId] = { fileName: bankFileName, accountId: acct, importedAt: today(), count: added };
      await persistImportBatches();
    }
    bankRows = []; bankOpening = null; bankClosing = null;
    if (snapErr) alert("Transactions imported, but the opening/closing balance could NOT be saved:\n\n" + snapErr +
      "\n\nAdd it manually on the Snapshot tab, or tell Claude this message.");
    else toast(`Imported ${added}${snaps ? `, ${snaps} balance snapshot${snaps > 1 ? "s" : ""}` : ""}` +
      `${dupes ? `, ${dupes} duplicates ignored` : ""}${skipped ? `, ${skipped} skipped` : ""}`);
    nav("Ledger");
  } finally {
    bankImporting = false;
  }
}
function parseAmountCell(s) { return parseFloat(String(s).replace(/[Rs,\s"]/gi, "")); }
async function findOrCreateAccount(name) {
  let a = DB.accounts.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (!a) {
    a = { id: uid(), name, type: "other", active: true };
    DB.accounts.push(a); await persistInsert("accounts", a);
  }
  return a;
}
async function importSnaps() {
  const lines = parseCsvLines(document.getElementById("impSnaps").value);
  let ok = 0, bad = 0;
  for (const cells of lines) {
    if (cells.length < 3) { bad++; continue; }
    const date = parseDateCell(cells[0]); const val = parseAmountCell(cells[cells.length - 1]);
    const name = cells.slice(1, cells.length - 1).join(",").trim();
    if (!date || !name || isNaN(val)) { bad++; continue; }
    const a = await findOrCreateAccount(name);
    const existing = DB.snapshots.find(s => s.date === date && s.account_id === a.id);
    if (existing) { existing.value = val; await persistUpdate("snapshots", existing.id, { value: val }); }
    else { const row = { id: uid(), date, account_id: a.id, value: val }; DB.snapshots.push(row); await persistInsert("snapshots", row); }
    ok++;
  }
  toast(`Imported ${ok} valuation rows${bad ? `, skipped ${bad}` : ""}`);
  if (ok) nav("Dashboard");
}
async function importTxns() {
  const lines = parseCsvLines(document.getElementById("impTxns").value);
  const kindMap = { income: "income", spend: "spend", expense: "spend",
    deposit: "transfer_in", withdraw: "transfer_out", withdrawal: "transfer_out",
    transfer_in: "transfer_in", transfer_out: "transfer_out" };
  let ok = 0, bad = 0;
  for (const cells of lines) {
    if (cells.length < 4) { bad++; continue; }
    const date = parseDateCell(cells[0]); const name = cells[1];
    const kind = kindMap[(cells[2] || "").toLowerCase()]; const amt = parseAmountCell(cells[3]);
    if (!date || !name || !kind || isNaN(amt)) { bad++; continue; }
    const a = await findOrCreateAccount(name);
    const row = { id: uid(), account_id: a.id, kind, date, amount: Math.abs(amt), note: cells.slice(4).join(",") || null };
    DB.txns.push(row); await persistInsert("transactions", row); ok++;
  }
  toast(`Imported ${ok} ledger rows${bad ? `, skipped ${bad}` : ""}`);
}
function exportJson() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `r3dfunds-backup-${today()}.json`;
  a.click();
}
function importJson(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data.accounts) throw new Error("not a R3d Funds backup");
      if (!confirm(`Restore ${data.accounts.length} accounts, ${(data.txns || []).length} transactions, ${(data.snapshots || []).length} snapshots? This replaces current local data.`)) return;
      DB = Object.assign({ accounts: [], txns: [], snapshots: [], targets: {}, importBatches: {} }, data);
      if (isCloud() && supaUser) {
        toast("Backup loaded — pushing to cloud…");
        for (const a of DB.accounts) await persistInsert("accounts", a).catch(() => {});
        for (const t of DB.txns) await persistInsert("transactions", t).catch(() => {});
        for (const s of DB.snapshots) await persistInsert("snapshots", s).catch(() => {});
        await persistTargets();
      } else localSave();
      toast("Restored"); render();
    } catch (e) { toast("Restore failed: " + e.message); }
  };
  rd.readAsText(f);
}
