async function saveTargets() {
  const t = {};
  for (const k of Object.keys(ACCT_TYPES)) {
    const v = parseFloat(document.getElementById("tg_" + k).value);
    if (!isNaN(v) && v > 0) t[k] = v;
  }
  const sum = Object.values(t).reduce((a, b) => a + b, 0);
  if (sum && Math.abs(sum - 100) > 0.5) return toast(`Targets sum to ${sum}% — make them total 100%`);
  DB.targets = t; await persistTargets(); toast("Targets saved");
}
function normalizeSupaUrl(raw) {
  let u = (raw || "").trim().replace(/\s+/g, "");
  if (!u) return "";
  u = u.replace(/\/+$/, "");                 // trailing slashes
  u = u.replace(/\/(rest|auth|storage)\/v\d.*$/i, ""); // pasted API endpoint
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u.replace(/\/+$/, "");
}
async function testSupa() {
  const url = normalizeSupaUrl(document.getElementById("sbUrl").value);
  const key = document.getElementById("sbKey").value.trim().replace(/\s+/g, "");
  const out = document.getElementById("sbTest");
  if (!url || !key) { out.innerHTML = `<span style="color:var(--down)">Fill both fields first.</span>`; return; }
  out.textContent = "Testing…";
  try {
    const r = await fetch(url + "/auth/v1/settings", { headers: { apikey: key } });
    if (r.ok) out.innerHTML = `<span style="color:var(--up);font-weight:600">✓ Connected — URL and key are valid. Click “Save & reload”.</span>`;
    else if (r.status === 401 || r.status === 403)
      out.innerHTML = `<span style="color:var(--down)">Reached the server, but the key was rejected (${r.status}).
        Copy the <strong>anon / public</strong> key from Project Settings → API Keys (not service_role).</span>`;
    else out.innerHTML = `<span style="color:var(--down)">Server replied ${r.status}. Check the URL.</span>`;
  } catch (e) {
    out.innerHTML = `<span style="color:var(--down)">Could not reach <code>${esc(url)}</code> — “${esc(e.message)}”.<br>
      Check the URL is exactly <code>https://YOURPROJECT.supabase.co</code> (no /rest/v1), the project isn’t paused,
      and that Supabase isn’t having an outage.</span>`;
  }
}
async function saveSupa() {
  cfg.supabaseUrl = normalizeSupaUrl(document.getElementById("sbUrl").value);
  cfg.supabaseKey = document.getElementById("sbKey").value.trim().replace(/\s+/g, "");
  saveCfg(cfg); location.reload();
}
function clearSupa() {
  if (!confirm("Switch back to local mode? Cloud data stays in Supabase untouched.")) return;
  delete cfg.supabaseUrl; delete cfg.supabaseKey; saveCfg(cfg); location.reload();
}
function authFields() {
  const e = (document.getElementById("auEmail") || {}).value || "";
  const p = (document.getElementById("auPass") || {}).value || "";
  return { email: e.trim(), password: p };
}
function authError(msg) {
  const box = document.getElementById("auMsg");
  if (box) box.innerHTML = `<span style="color:var(--down);font-weight:600">${esc(msg)}</span>`;
  else toast(msg);
}
function friendlyAuth(msg) {
  const m = (msg || "").toLowerCase();
  if (m.includes("anonymous")) return "Type your email and password in both boxes first.";
  if (m.includes("already registered") || m.includes("already been registered"))
    return "This email already has an account — use Sign in instead.";
  if (m.includes("signups not allowed"))
    return "Sign-ups are disabled in Supabase. Enable: Authentication → Sign In / Providers → Email → Allow new users to sign up.";
  if (m.includes("invalid login")) return "Wrong email or password. If you haven't created the account yet, click Create account.";
  if (m.includes("email not confirmed"))
    return "Email not confirmed. In Supabase: Authentication → Sign In / Providers → Email → turn OFF 'Confirm email', then sign in again.";
  if (m.includes("password")) return msg + " (minimum 6 characters)";
  if (m.includes("failed to fetch")) return "Cannot reach Supabase — check the connection in Settings, or Supabase may be down.";
  return msg;
}
async function signIn() {
  const { email, password } = authFields();
  if (!email || !password) return authError("Enter both email and password.");
  const { error } = await supa.auth.signInWithPassword({ email, password });
  if (error) return authError(friendlyAuth(error.message));
  location.reload();
}
async function signUp() {
  const { email, password } = authFields();
  if (!email || !password) return authError("Enter both email and password.");
  if (!email.includes("@")) return authError("That doesn't look like an email address.");
  if (password.length < 6) return authError("Password must be at least 6 characters.");
  const { data, error } = await supa.auth.signUp({ email, password });
  if (error) return authError(friendlyAuth(error.message));
  if (data.session) { location.reload(); return; }   // confirm-email off → straight in
  authError("Account created. Now click Sign in. (If it asks for confirmation, check your email.)");
}
async function signOut() { await supa.auth.signOut(); location.reload(); }
function wipeLocal() {
  if (!confirm("Erase ALL local data on this device? (Cloud data is not affected.) Download a backup first?")) return;
  localStorage.removeItem(LS_KEY); localLoad(); render(); toast("Local data erased");
}

function copyAiPrompt() {
  const series = netWorthSeries();
  const lastD = latestSnapDate();
  const lines = [];
  lines.push("You are reviewing my personal finances (amounts in PKR). Give me a monthly review: what grew, what lagged, allocation drift vs targets, spending trend, and 3 concrete optimization suggestions. Note: general analysis only, not licensed financial advice.");
  lines.push("\n## Net worth by month");
  series.forEach(s => lines.push(`${s.date}: ${s.value}`));
  lines.push("\n## Accounts (latest value, XIRR annualized)");
  DB.accounts.filter(a => a.active !== false).forEach(a => {
    const r = accountXirr(a.id);
    lines.push(`${a.name} [${ACCT_TYPES[a.type].label}]: ${lastD ? valueAt(a.id, lastD) : "?"} | XIRR: ${r != null ? (r * 100).toFixed(1) + "%" : "n/a"}`);
  });
  const t = DB.targets || {};
  if (Object.keys(t).length) {
    lines.push("\n## Target allocation");
    Object.entries(t).forEach(([k, v]) => lines.push(`${ACCT_TYPES[k].label}: ${v}%`));
  }
  const sp = monthlySpend();
  if (sp.length) {
    lines.push("\n## Monthly personal spending");
    sp.forEach(s => lines.push(`${s.month}: ${s.value}`));
  }
  lines.push("\n## Recent ledger (last 25)");
  [...DB.txns].sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 25).forEach(tx =>
    lines.push(`${tx.date} | ${acctName(tx.account_id)} | ${tx.kind} | ${tx.amount} | ${tx.note || ""}`));
  navigator.clipboard.writeText(lines.join("\n"))
    .then(() => toast("Copied — paste it to Claude for your review"))
    .catch(() => toast("Copy failed — browser blocked clipboard"));
}

/* ---------------- password lock ---------------- */
function renderLock(msg) {
  document.getElementById("main").innerHTML = `
    <div class="card" style="max-width:400px;margin:60px auto;text-align:center">
      <div style="font-size:34px;margin-bottom:6px">🔒</div>
      <h2 style="justify-content:center">R3d Funds is locked</h2>
      <p class="muted">Enter your password to decrypt your data.</p>
      ${msg ? `<p style="color:var(--down);font-weight:600;margin-top:6px">${msg}</p>` : ""}
      <div style="margin-top:14px"><input type="password" id="lockPw" placeholder="Password" autofocus
        onkeydown="if(event.key==='Enter')unlockApp()"></div>
      <p style="margin-top:12px"><button class="btn" style="width:100%" onclick="unlockApp()">Unlock</button></p>
      <p class="muted" style="margin-top:10px;font-size:11px">Forgot it? The data cannot be decrypted without it —
      restore from a JSON backup instead.</p>
    </div>`;
  document.getElementById("nav").innerHTML = "";
  document.getElementById("pageTitle").textContent = "Locked";
  const pw = document.getElementById("lockPw"); if (pw) pw.focus();
}
async function unlockApp() {
  const pw = document.getElementById("lockPw").value;
  if (!pw) return;
  try {
    const key = await deriveKey(pw, cfg.lockSalt);
    await decStr(key, cfg.lockCheck); // throws on wrong password
    lockKey = key;
    const parsed = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    if (parsed.enc) DB = Object.assign({ accounts: [], txns: [], snapshots: [], targets: {}, importBatches: {} },
      JSON.parse(await decStr(key, parsed)));
    else { localLoad(); localSave(); } // first unlock after enabling: encrypt existing plain data
    render();
  } catch { renderLock("Wrong password"); }
}
async function setPassword() {
  const p1 = document.getElementById("pwNew").value, p2 = document.getElementById("pwNew2").value;
  if (!p1 || p1.length < 6) return toast("Use at least 6 characters");
  if (p1 !== p2) return toast("Passwords don't match");
  const salt = bufToB64(crypto.getRandomValues(new Uint8Array(16)));
  const key = await deriveKey(p1, salt);
  cfg.lockSalt = salt; cfg.lockCheck = await encStr(key, "myfunds-ok");
  saveCfg(cfg); lockKey = key; localSave();
  toast("Password set — data is now encrypted"); render();
}
async function changePassword() {
  const oldPw = document.getElementById("pwOld").value;
  const p1 = document.getElementById("pwNew").value, p2 = document.getElementById("pwNew2").value;
  try { await decStr(await deriveKey(oldPw, cfg.lockSalt), cfg.lockCheck); }
  catch { return toast("Current password is wrong"); }
  if (!p1 || p1.length < 6) return toast("Use at least 6 characters");
  if (p1 !== p2) return toast("New passwords don't match");
  const salt = bufToB64(crypto.getRandomValues(new Uint8Array(16)));
  const key = await deriveKey(p1, salt);
  cfg.lockSalt = salt; cfg.lockCheck = await encStr(key, "myfunds-ok");
  saveCfg(cfg); lockKey = key; localSave();
  toast("Password changed"); render();
}
async function removePassword() {
  const oldPw = document.getElementById("pwOld").value;
  try { await decStr(await deriveKey(oldPw, cfg.lockSalt), cfg.lockCheck); }
  catch { return toast("Current password is wrong"); }
  if (!confirm("Remove the password? Data will be stored unencrypted on this device.")) return;
  delete cfg.lockSalt; delete cfg.lockCheck; saveCfg(cfg);
  lockKey = null; localSave();
  toast("Password removed"); render();
}
function lockNow() { location.reload(); }

/* ---------------- boot ---------------- */
(async function boot() {
  if (isCloud()) {
    try {
      await cloudInit();
      if (supaUser) await cloudLoadAll();
    } catch (e) {
      console.error("cloud load", e);
    }
    render(); return;
  }
  if (cfg.lockSalt && cfg.lockCheck) { renderNav(); renderLock(); return; }
  localLoad();
  render();
})();
